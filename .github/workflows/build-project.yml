              $cores = [Math]::Max(1, [int]((Get-CimInstance Win32_Processor | Measure-Object NumberOfLogicalProcessors -Sum).Sum))
              $free = [double](Get-CimInstance Win32_OperatingSystem).FreePhysicalMemory * 1KB / 1GB
              # Estimates rather than hard memory guarantees. Avoid paging on a busy PC.
              $memoryJobs = [Math]::Max(1,[int][Math]::Floor(($free-3.0)/0.75))
              $wanted = if ($Jobs) { $Jobs } else { $cores }
              $threads = [Math]::Max(1,[Math]::Min($cores,[Math]::Min($wanted,$memoryJobs)))
              Say ('CPU workers / CPU线程: {0}/{1}; free RAM / 可用内存: {2:N1} GiB' -f $threads,$cores,$free)
              if ($DryRun) {
                  Say ('[DRY RUN] victory.exe shaders "{0}" "{1}" --jobs {2}' -f $archive,$GameExe,$threads)
                  if (-not $SkipPipelines) { Say '[DRY RUN] Then victory.exe warm --jobs <memory-aware worker count>; all recorded pipelines, no --used filter.' }
