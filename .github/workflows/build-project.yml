                  $exitCode = 0
              } else {
                  if ($free -lt 3.75) { throw 'Less than 3.75 GiB free RAM; close other applications and retry.' }
                  $logs = Join-Path $root 'logs'
                  [void](New-Item -ItemType Directory -Path $logs -Force)
                  $log = Join-Path $logs ('shader-precompile-' + (Get-Date -Format 'yyyyMMdd-HHmmss-fff') + '.log')
                  Say ('Started / 开始: {0}; log / 日志: {1}' -f (Get-Date -Format 'yyyy-MM-dd HH:mm:ss'),$log)
                  Say ('Preset={0}; workers={1}; cache={2}' -f $preset.name,$threads,$env:VICTORY_CACHE_DIR)
                  Say '[1/2] Translating every discovered shader; cached entries are reused. / 遍历全部着色器并复用缓存。'
                  $timer = [Diagnostics.Stopwatch]::StartNew()
                  $output = RunTool -ToolArguments @('shaders',$archive,$GameExe,'--jobs',[string]$threads)
                  $summary = @($output | Where-Object { $_ -match '^\d+ shaders in the cache, \d+ do not translate, ' })
                  if ($summary.Count -ne 1) { throw 'Missing shader result summary; this run cannot be verified.' }
                  if ($summary[0] -notmatch '^(?<good>\d+) shaders in the cache, (?<bad>\d+) do not translate, ') { throw 'Unexpected summary.' }
                  $good = [long]$Matches.good; $bad = [long]$Matches.bad
                  if ($good + $bad -eq 0) { throw 'No shaders found in these inputs.' }
                  $exitCode = if ($bad -gt 0) { 2 } else { 0 }
                  if ($bad -gt 0) { Say 'Some shaders were not translated. Exact grouped reasons are in the output/log. / 部分翻译失败，具体原因已记录。' }
                  $known = Join-Path $env:VICTORY_CACHE_DIR 'pipelines\known-pipelines.bin'
                  $knownShaders = Join-Path $env:VICTORY_CACHE_DIR 'pipelines\known-shaders.bin'
                  if ($SkipPipelines) {
                      Say '[2/2] Pipeline warmup skipped by request. / 已按参数跳过管线预热。'
                  } elseif ((Test-Path -LiteralPath $known -PathType Leaf) -and (Test-Path -LiteralPath $knownShaders -PathType Leaf) -and (Get-Item -LiteralPath $known).Length -gt 0 -and (Get-Item -LiteralPath $knownShaders).Length -gt 0) {
                      $free = [double](Get-CimInstance Win32_OperatingSystem).FreePhysicalMemory * 1KB / 1GB
                      if ($free -lt 4.5) { throw 'Shader phase saved; less than 4.5 GiB free for GPU pipeline warmup. Free memory and rerun.' }
                      $defaultPipelineJobs = [Math]::Max(1,[int][Math]::Floor($cores*2/3))
                      $wanted = if ($PipelineJobs) { $PipelineJobs } else { $defaultPipelineJobs }
                      $pipelineWorkers = [Math]::Max(1,[Math]::Min(8,[Math]::Min($wanted,[int][Math]::Floor(($free-3.0)/1.5))))
                      Say ('[2/2] Warming all recorded GPU pipelines, {0} processes. / 预热全部已记录的GPU管线，{0}个进程。' -f $pipelineWorkers)
                      $pipelineOutput = RunTool -ToolArguments @('warm','--jobs',[string]$pipelineWorkers)
                      $pipelineSummary = @($pipelineOutput | Where-Object { $_ -match '^\d+ made in .+ \((?<refused>\d+) have no host pipeline, (?<crashed>\d+) ended their process\);' })
                      if ($pipelineSummary.Count -ne 1) { throw 'Missing pipeline result summary.' }
                      [void]($pipelineSummary[0] -match '\((?<refused>\d+) have no host pipeline, (?<crashed>\d+) ended their process\)')
                      if ([long]$Matches.refused -gt 0 -or [long]$Matches.crashed -gt 0) { $exitCode = 2; Say 'Some pipelines failed or their workers ended; review the log and cache/pipelines/warm-bad.txt.' }
                  } else {
                      Say '[2/2] No recorded pipelines yet. Run Record-Pipelines.bat once, enter the game, exit normally, then run this script again.'
                      Say '还没有管线记录：先用 Record-Pipelines.bat 进入游戏场景并正常退出，再执行本脚本。首次无法凭空生成从未记录过的GPU管线。'
                  }
                  $timer.Stop()
                  Say ('Finished / 结束: {0}; elapsed / 用时: {1:N1} min; result / 状态: {2}' -f (Get-Date -Format 'yyyy-MM-dd HH:mm:ss'),$timer.Elapsed.TotalMinutes,$exitCode)
                  Say 'Shader compilation does not guarantee 30 FPS or fix upstream rendering errors. / 预编译不能保证稳定30帧或修复上游渲染错误。'
              }
          } catch {
              Write-Host ('[ERROR / 错误] ' + $_.Exception.Message) -ForegroundColor Red
              if ($log) { Add-Content -LiteralPath $log -Value $_.Exception.ToString() -Encoding UTF8 -ErrorAction SilentlyContinue }
              $exitCode = 1
          } finally {
              if ($owns -and $null -ne $mutex) { $mutex.ReleaseMutex() }
              if ($null -ne $mutex) { $mutex.Dispose() }
              if (-not $DryRun -and -not $NoPause) { [void](Read-Host 'Press Enter to close / 按回车关闭') }
          }
          exit $exitCode
