          )
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          [Console]::OutputEncoding = [Text.UTF8Encoding]::new($false)
          $OutputEncoding = [Console]::OutputEncoding
          $root = $PSScriptRoot
          $exe = Join-Path $root 'victory.exe'
          $log = $null
          $mutex = $null
          $owns = $false
          $exitCode = 1
          function Say([string]$Text) {
              Write-Host $Text
              if ($script:log) { Add-Content -LiteralPath $script:log -Value $Text -Encoding UTF8 }
          }
          function ActiveTitle {
              @(Get-Process -Name @('victory','victory_sm') -ErrorAction SilentlyContinue | Where-Object {
                  try { [string]::Equals($_.Path, $script:exe, [StringComparison]::OrdinalIgnoreCase) } catch { $false }
              })
          }
          function RunTool([string[]]$ToolArguments) {
              Say ('> victory.exe ' + (($ToolArguments | ForEach-Object { '"' + $_ + '"' }) -join ' '))
              $lines = [Collections.Generic.List[string]]::new()
              $previousPreference = $ErrorActionPreference
              try {
                  $ErrorActionPreference = 'Continue'
                  Push-Location -LiteralPath $script:root
                  & $script:exe @ToolArguments 2>&1 | ForEach-Object {
                      $text = $_.ToString()
                      Say $text
                      $lines.Add($text)
                  }
                  $result = $LASTEXITCODE
              } finally { Pop-Location; $ErrorActionPreference = $previousPreference }
              if ($result -ne 0) { throw "victory.exe returned $result; see $script:log" }
              return ,$lines
          }
          try {
              if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw 'victory.exe must be beside this script.' }
              $preset = Get-Content -LiteralPath (Join-Path $root 'RUNTIME-PRESET.json') -Raw -Encoding UTF8 | ConvertFrom-Json
              foreach ($entry in $preset.environment.PSObject.Properties) {
                  if ($entry.Name -notmatch '^VICTORY_[A-Z0-9_]+$') { throw 'Invalid runtime preset key.' }
                  [Environment]::SetEnvironmentVariable($entry.Name, [string]$entry.Value, 'Process')
              }
              foreach ($name in $preset.clear_environment) {
                  if ($name -notmatch '^VICTORY_[A-Z0-9_]+$') { throw 'Invalid runtime preset key.' }
                  [Environment]::SetEnvironmentVariable($name, $null, 'Process')
              }
              if (Test-Path -LiteralPath (Join-Path $root 'Apply-NVIDIA-Preset.ps1')) { . (Join-Path $root 'Apply-NVIDIA-Preset.ps1') }
              $env:VICTORY_CACHE_DIR = Join-Path $root 'cache'
              $env:VICTORY_DATA_DIR = Join-Path $root 'data'
              $env:VICTORY_WARM_SECONDS = $null
              Say '=== Shader and pipeline precompile / 着色器与管线预编译 ==='
              Say ('Preset / 预设: ' + $preset.name)
              Say ('Cache / 缓存: ' + $env:VICTORY_CACHE_DIR)
              Say 'GPU capabilities are detected by victory.exe, not hardcoded. / 程序自动探测真实显卡。'
              if (-not $GameExe -and $env:VICTORY_GAME_DIR) { $GameExe = Join-Path $env:VICTORY_GAME_DIR 'game_scarlett_master.exe' }
              if (-not $GameExe -and -not $DryRun) { $GameExe = Read-Host 'Full path to game EXE / 输入或粘贴游戏主程序完整路径' }
              if ($GameExe) {
                  $GameExe = $GameExe.Trim().Trim('"')
                  if (-not (Test-Path -LiteralPath $GameExe -PathType Leaf)) { throw "Game EXE not found: $GameExe" }
                  $GameExe = (Get-Item -LiteralPath $GameExe).FullName
                  $gameRoot = [IO.Path]::GetDirectoryName($GameExe)
                  $archive = Join-Path $gameRoot 'shaders.rpf'
                  if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) { throw "Shader archive not found: $archive" }
                  $env:VICTORY_GAME_DIR = $gameRoot
              } else {
                  $archive = '<game folder>\shaders.rpf'
                  $GameExe = '<game folder>\game_scarlett_master.exe'
              }
              if (-not $DryRun) {
                  $hash = [Security.Cryptography.SHA256]::Create()
                  try { $id = [BitConverter]::ToString($hash.ComputeHash([Text.Encoding]::UTF8.GetBytes($root.ToLowerInvariant()))).Replace('-','') } finally { $hash.Dispose() }
                  $mutex = [Threading.Mutex]::new($false, ('Local\LauncherShaderWarmup_' + $id))
                  try { $owns = $mutex.WaitOne(0) } catch [Threading.AbandonedMutexException] { $owns = $true }
                  if (-not $owns) { throw 'Another precompile script is already running in this folder.' }
                  if (@(ActiveTitle).Count -gt 0) {
                      Say 'Waiting for the game to exit; no process will be killed. / 请正常退出游戏，本窗口会等待。'
                      while (@(ActiveTitle).Count -gt 0) { Start-Sleep -Seconds 3 }
