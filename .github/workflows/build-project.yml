name: Build and package one upstream

on:
  workflow_call:
    inputs:
      upstream:
        type: string
        required: true
      cpu_target:
        type: string
        default: x86-64-v3
      source_branch:
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_RELEASE_OPT_LEVEL: "3"
      CARGO_PROFILE_RELEASE_LTO: fat
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
      CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static -C target-cpu=${{ inputs.cpu_target }}
      CPU_TARGET: ${{ inputs.cpu_target }}
      UPSTREAM: ${{ inputs.upstream }}
    outputs:
      artifact: ${{ steps.source.outputs.id }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Resolve the requested upstream branch commit
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_BRANCH_INPUT: ${{ inputs.source_branch }}
        run: |
          $ErrorActionPreference = 'Stop'
          $allowed = @('Marvisak/VIctory', 'xcl-dev/xcl', 'fxceless/victory-fork', 'Zettrox/ztrx', 'uiliannn/VItoriaBr', 'Belobug/VIctory-Belobug-AMD', 'DexNom/VIctory', 'avatarmanz/VIctory-7900XTX', 'carlm125/cool_fox', 'stellarr-studio/kelvaroq', 'LooperSalty/AnyXboxX', 'trustno1-coder/VIctory-NVIDIA')
          if ($env:UPSTREAM -cnotin $allowed) { throw 'Unsupported upstream repository.' }
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          if ($env:CPU_TARGET -cnotin @('x86-64-v3', 'x86-64')) { throw 'Unsupported CPU target.' }
          "id=$($env:UPSTREAM.Replace('/', '-'))" >> $env:GITHUB_OUTPUT
          $url = "$env:GITHUB_API_URL/repos/$env:UPSTREAM"
          try {
              $repo = Invoke-RestMethod -Uri $url -Headers $headers

              # Use requested branch; fall back to upstream default branch.
              $branchName = $env:SOURCE_BRANCH_INPUT.Trim()

              if ([string]::IsNullOrWhiteSpace($branchName)) {
                  $branchName = $repo.default_branch
              }

              if ($branchName -match '[\r\n]') {
                  throw 'Invalid source branch name.'
              }

              $branch = [Uri]::EscapeDataString($branchName)
              $commit = Invoke-RestMethod -Uri "$url/commits/$branch" -Headers $headers
          } catch {
              if ([int]$_.Exception.Response.StatusCode -ne 404) { throw }
              # Only an upstream repository/commit HTTP 404 is skippable.
              # Compiler errors, permissions, rate limits and dependency errors still fail the batch.
              $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
              [System.IO.Directory]::CreateDirectory($dist) | Out-Null
              $info = [ordered]@{
                  upstream = $env:UPSTREAM; upstream_url = "https://github.com/$env:UPSTREAM"
                  status = 'unavailable'; http_status = 404; source_sha = $null
                  source_branch = $null; checked_utc = [DateTime]::UtcNow.ToString('o')
                  workflow = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
                  reason = 'HTTP 404: project source unavailable; cannot compile / 项目404，无法下载源码，无法编译'
              }
              $utf8 = [System.Text.UTF8Encoding]::new($false)
              [System.IO.File]::WriteAllText((Join-Path $dist 'metadata.json'), ($info | ConvertTo-Json -Depth 8), $utf8)
              [System.IO.File]::WriteAllText((Join-Path $dist 'RELEASE-NOTES.md'), "$env:UPSTREAM : $($info.reason)", $utf8)
              "available=false" >> $env:GITHUB_OUTPUT
              Write-Host "$env:UPSTREAM : $($info.reason)"
              return
          }
          "available=true" >> $env:GITHUB_OUTPUT
          if ($commit.sha -notmatch '^[0-9a-f]{40}$') { throw 'Invalid upstream SHA.' }
          "sha=$($commit.sha)" >> $env:GITHUB_OUTPUT
          "branch=$branchName" >> $env:GITHUB_OUTPUT
          Write-Host "Building $env:UPSTREAM@$($commit.sha) from $branchName"
          Write-Host "Building $env:UPSTREAM@$($commit.sha) from $($repo.default_branch)"

      - name: Check out exactly the resolved upstream SHA
        if: steps.source.outputs.available == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.upstream }}
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false
          fetch-depth: 1
          submodules: ${{ inputs.upstream == 'LooperSalty/AnyXboxX' }}

      - name: Install upstream Rust toolchain and compile optimized release
        if: steps.source.outputs.available == 'true'
        id: compile
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path -LiteralPath 'rust-toolchain.toml') {
            rustup show
          } else {
            rustup toolchain install stable --profile minimal --target x86_64-pc-windows-msvc
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            rustup default stable
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc --version --verbose
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $package = if ($env:UPSTREAM -eq 'xcl-dev/xcl') { 'xcl' } else { 'victory' }
          if ($env:UPSTREAM -ceq 'DexNom/VIctory') {
              & .\Initialize-FormatTables.ps1
              if (-not $?) { throw 'DexNom format table initialization failed.' }
          }
          $compileStarted = [DateTime]::UtcNow.ToString('o')
          if ($env:UPSTREAM -ceq 'stellarr-studio/kelvaroq') {
              # Preserve the official native patches, portable dependencies and reproducible path flags.
              $adapter = @'
          import importlib.util
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil
          import subprocess

          root = Path.cwd()
          cpu = os.environ['CPU_TARGET']
          if cpu not in ('x86-64-v3', 'x86-64'):
              raise ValueError('Unsupported CPU target')
          original_run = subprocess.run
          events = []
          installed = {'stable'}

          def optimized_run(args, *positional, **kwargs):
              argv = list(map(str, args)) if not isinstance(args, str) else []
              if argv and Path(argv[0]).stem.lower() == 'cargo' and 'build' in argv:
                  channel = next((a[1:] for a in argv if a.startswith('+')), 'stable')
                  if channel not in installed:
                      original_run(['rustup', 'toolchain', 'install', channel, '--profile', 'minimal', '--target', 'x86_64-pc-windows-msvc'], check=True)
                      installed.add(channel)
                  env = dict(kwargs.get('env', os.environ))
                  flags = env.get('CARGO_ENCODED_RUSTFLAGS', '').split('\x1f')
                  flags = [f for f in flags if f]
                  frontend = Path(kwargs.get('cwd', root)).resolve() == root
                  # src/simd.rs explicitly imports ucrt; mixing static/dynamic UCRT causes LNK2005.
                  crt = '-crt-static' if frontend else '+crt-static'
                  flags += ['-Ctarget-feature=' + crt, '-Ctarget-cpu=' + cpu]
                  env['CARGO_ENCODED_RUSTFLAGS'] = '\x1f'.join(flags)
                  kwargs['env'] = env
                  event = dict(command=argv, rust_toolchain=channel, rust_crt='dynamic' if frontend else 'static', encoded_rustflags=flags,
                               release_env={k: env[k] for k in ('CARGO_PROFILE_RELEASE_OPT_LEVEL', 'CARGO_PROFILE_RELEASE_LTO', 'CARGO_PROFILE_RELEASE_CODEGEN_UNITS')})
                  print('Optimized upstream build:', json.dumps(event), flush=True)
                  result = original_run(args, *positional, **kwargs)
                  events.append(event)
                  return result
              return original_run(args, *positional, **kwargs)

          def load(name):
              spec = importlib.util.spec_from_file_location(name, root / 'scripts' / (name + '.py'))
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              return module

          subprocess.run = optimized_run
          native = load('build_native')
          receipt = native.run(native.UPSTREAM, native.OUTPUT.resolve())
          portable = load('package_windows')
          original_release_build = portable.release_build
          layout_fixes = []

          def compatible_release_build():
              release = original_release_build()
              desktop = release / 'kelvaroq-desktop.exe'
              if not desktop.is_file():
                  # New Cargo adds a package/hash level under build/. Upstream's parents[2]
                  # leaves this successfully compiled companion one directory too high.
                  candidates = sorted((root / 'target/package-build').rglob('kelvaroq-desktop.exe'), key=lambda p: len(str(p)))
                  if not candidates:
                      raise ValueError('Official desktop companion was not produced')
                  # build_desktop.py keeps both OUT_DIR/original and its copied companion.
                  # Multiple copies are valid only when they are byte-identical.
                  digests = {hashlib.sha256(p.read_bytes()).hexdigest() for p in candidates}
                  if len(digests) != 1:
                      raise ValueError('Inconsistent official desktop companion copies: ' + repr(candidates))
                  shutil.copyfile(candidates[0], desktop)
                  layout_fixes.append(dict(source=str(candidates[0].relative_to(root)), destination=str(desktop.relative_to(root)), sha256=digests.pop()))
              return release

          portable.release_build = compatible_release_build
          portable.main()  # Builds frontends, assembles pinned inputs and runs upstream isolated smoke tests.
          archives = list((root / 'target/dist').glob('Kelvaroq-*-windows-x64.zip'))
          if len(events) != 2 or len(archives) != 1:
              raise ValueError('Expected native + frontend builds and one verified portable archive')
          (root / '.builder-kelvaroq.json').write_text(json.dumps(dict(
              archive=str(archives[0].relative_to(root)), native=receipt, builds=events, layout_fixes=layout_fixes), indent=2), encoding='utf-8')
          '@
              $scriptPath = Join-Path $env:RUNNER_TEMP 'build-kelvaroq.py'
              [IO.File]::WriteAllText($scriptPath, $adapter, [Text.UTF8Encoding]::new($false))
              python $scriptPath
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } elseif ($env:UPSTREAM -ceq 'LooperSalty/AnyXboxX') {
              cargo build --release --locked --target x86_64-pc-windows-msvc --package anyxboxx --package anyxboxx-launcher --bins
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              Push-Location -LiteralPath 'third_party/victory'
              try {
                  rustup show
                  if ($LASTEXITCODE -ne 0) { throw 'Vendored backend toolchain installation failed.' }
                  # This exact upstream needs diagnostics to compile; do not patch it away.
                  cargo build --release --locked --target x86_64-pc-windows-msvc --package victory --bin victory --features diagnostics
                  if ($LASTEXITCODE -ne 0) { throw 'AnyXboxX vendored backend build failed.' }
                  $backendRust = (& rustc --version | Out-String).Trim()
              } finally { Pop-Location }
              [IO.File]::WriteAllText((Join-Path $env:GITHUB_WORKSPACE '.builder-anyxboxx-rust.txt'), $backendRust)
          } else {
              $buildArgs = @('build', '--release', '--locked', '--package', $package, '--target', 'x86_64-pc-windows-msvc')
              if ($env:UPSTREAM -ceq 'DexNom/VIctory') { $buildArgs += '--bins' } else { $buildArgs += @('--bin', $package) }
              if ($env:UPSTREAM -ceq 'trustno1-coder/VIctory-NVIDIA') { $buildArgs += @('--features', 'diagnostics') }
              cargo @buildArgs
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          "started_utc=$compileStarted" >> $env:GITHUB_OUTPUT
          "completed_utc=$([DateTime]::UtcNow.ToString('o'))" >> $env:GITHUB_OUTPUT

      - name: Package owner/repository portable archive and verify extraction
        if: steps.source.outputs.available == 'true'
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          SOURCE_BRANCH: ${{ steps.source.outputs.branch }}
          COMPILE_STARTED_UTC: ${{ steps.compile.outputs.started_utc }}
          COMPILED_UTC: ${{ steps.compile.outputs.completed_utc }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $utf8 = [System.Text.UTF8Encoding]::new($false)
          $repo = $env:UPSTREAM
          $parts = $repo.Split('/')
          $owner, $name = $parts
          $id = $repo.Replace('/', '-')
          $sha = $env:SOURCE_SHA
          $actual = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -ne $sha) { throw 'Checkout SHA mismatch.' }
          $gitVersion = (& git --version | Out-String).Trim()
          $rustVersion = (& rustc --version | Out-String).Trim()
          $commitDate = (& git show -s --format=%cI HEAD | Out-String).Trim()
          $stage = Join-Path $env:RUNNER_TEMP ('package-' + [Guid]::NewGuid().ToString('N'))
          $root = Join-Path (Join-Path $stage $owner) $name
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          [System.IO.Directory]::CreateDirectory($root) | Out-Null
          [System.IO.Directory]::CreateDirectory($dist) | Out-Null
          $isXcl = $repo -eq 'xcl-dev/xcl'
          $isKelvaroq = $repo -ceq 'stellarr-studio/kelvaroq'
          $isAnyXboxX = $repo -ceq 'LooperSalty/AnyXboxX'
          $isNvidia = $repo -ceq 'trustno1-coder/VIctory-NVIDIA'
          $binaryName = if ($isXcl) { 'xcl.exe' } elseif ($isKelvaroq) { 'kelvaroq-cli.exe' } elseif ($isAnyXboxX) { 'anyxboxx.exe' } else { 'victory.exe' }
          $backend = $null
          $kelvaroqBuild = $null
          if ($isKelvaroq) {
              $kelvaroqBuild = Get-Content -LiteralPath '.builder-kelvaroq.json' -Raw | ConvertFrom-Json
              Expand-Archive -LiteralPath $kelvaroqBuild.archive -DestinationPath $root
              Copy-Item -LiteralPath '.builder-kelvaroq.json' -Destination (Join-Path $root 'COMPILER-RECEIPT.json')
              $backend = [ordered]@{
                  upstream = $kelvaroqBuild.native.upstream; source_sha = $kelvaroqBuild.native.revision
                  patched_tree = $kelvaroqBuild.native.patched_tree; rust_version = $kelvaroqBuild.native.rust
                  receipt = 'native/build.json'; source_archive = 'sources/native.zip'
              }
          } else {
              $binary = Join-Path $env:CARGO_TARGET_DIR "x86_64-pc-windows-msvc/release/$binaryName"
              Copy-Item -LiteralPath $binary -Destination $root
          }
          if ($isAnyXboxX) {
              foreach ($extra in @('anyxboxx-launcher.exe', 'victory.exe')) {
                  Copy-Item -LiteralPath (Join-Path $env:CARGO_TARGET_DIR "x86_64-pc-windows-msvc/release/$extra") -Destination $root
              }
              $backendTree = (& git rev-parse "${sha}:third_party/victory" | Out-String).Trim()
              if ($LASTEXITCODE -ne 0 -or $backendTree -notmatch '^[0-9a-f]{40}$') { throw 'Invalid vendored backend tree.' }
              $backend = [ordered]@{
                  upstream = $repo; source_path = 'third_party/victory'; source_tree = $backendTree
                  rust_version = (Get-Content -LiteralPath '.builder-anyxboxx-rust.txt' -Raw).Trim()
                  source_archive = 'source.zip'; diagnostics = $true
              }
              Copy-Item -LiteralPath 'docs' -Destination (Join-Path $root 'docs') -Recurse
              Copy-Item -LiteralPath 'third_party/victory/LICENSE' -Destination (Join-Path $root 'LICENSE-victory')
              $tomboxSha = (& git -C third_party/tombox rev-parse HEAD | Out-String).Trim()
              $tomboxPin = (& git rev-parse "${sha}:third_party/tombox" | Out-String).Trim()
              if ($LASTEXITCODE -ne 0 -or $tomboxSha -notmatch '^[0-9a-f]{40}$' -or $tomboxSha -cne $tomboxPin) { throw 'TomBox submodule SHA mismatch.' }
              [IO.Directory]::CreateDirectory((Join-Path $root 'sources')) | Out-Null
              & git -C third_party/tombox archive --format=zip "--output=$(Join-Path $root 'sources/tombox.zip')" HEAD
              if ($LASTEXITCODE -ne 0) { throw 'Pinned submodule source archive failed.' }
              $backend.submodule = [ordered]@{ upstream = 'omonkeyz/xbox-emulator'; source_sha = $tomboxSha; source_path = 'third_party/tombox'; source_archive = 'sources/tombox.zip' }
              & (Join-Path $root 'victory.exe') --help
              if ($LASTEXITCODE -ne 0) { throw 'Vendored backend --help failed.' }
          }
          if ($repo -ceq 'DexNom/VIctory') {
              foreach ($extra in @('victory-play.exe', 'victory-warm.exe')) {
                  Copy-Item -LiteralPath (Join-Path (Split-Path $binary -Parent) $extra) -Destination $root
              }
          }
          & (Join-Path $root $binaryName) --help
          if ($LASTEXITCODE -ne 0) { throw 'Executable --help failed.' }
          foreach ($file in @('LICENSE', 'README.md', 'THIRD_PARTY.md', 'victory.example.toml')) {
              if (Test-Path -LiteralPath $file) { Copy-Item -LiteralPath $file -Destination $root }
          }
          function Get-Archive([string]$Url, [string]$Expected, [string]$Name) {
              $zip = Join-Path $stage ($Name + '.zip')
              Invoke-WebRequest -Uri $Url -OutFile $zip
              if ((Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $Expected) { throw "Bad $Name checksum." }
              $folder = Join-Path $stage $Name
              Expand-Archive -LiteralPath $zip -DestinationPath $folder
              return $folder
          }
          function Copy-Notices([string]$From, [string]$To) {
              $files = @(Get-ChildItem -LiteralPath $From -Recurse -File | Where-Object { $_.Name -match '(?i)license|notice|copying' })
              if ($files.Count -eq 0) { throw 'Missing dependency license notices.' }
              foreach ($file in $files) {
                  $dest = Join-Path $To ([System.IO.Path]::GetRelativePath($From, $file.FullName))
                  [System.IO.Directory]::CreateDirectory((Split-Path -Parent $dest)) | Out-Null
                  Copy-Item -LiteralPath $file.FullName -Destination $dest
              }
          }
          if ($isXcl) {
              $dxc = Get-Archive 'https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.9.2609/dxc_2026_09_29.zip' 'ad31b1fc8443175d204f77a611fdb3ef2ec42759bdc2f1167368de24a4a7e7f1' 'dxc'
              $agility = Get-Archive 'https://api.nuget.org/v3-flatcontainer/microsoft.direct3d.d3d12/1.620.2/microsoft.direct3d.d3d12.1.620.2.nupkg' '70489669c2bbeaf318b62d72b0ac3e753d521387bfc848c9763791c4e920bfcc' 'agility'
              foreach ($dll in @('dxcompiler.dll', 'dxil.dll')) { Copy-Item -LiteralPath (Join-Path $dxc "bin/x64/$dll") -Destination $root }
              $d3d12 = Join-Path $root 'D3D12'
              [System.IO.Directory]::CreateDirectory($d3d12) | Out-Null
              Copy-Item -Path (Join-Path $agility 'build/native/bin/x64/*.dll') -Destination $d3d12
              Copy-Notices $dxc (Join-Path $root 'licenses/DXC')
              Copy-Notices $agility (Join-Path $root 'licenses/Agility')
          }
          $runtimePreset = $null
          $runtimeEnv = [ordered]@{}
          $presetCommands = 'rem No project-specific runtime preset.'
          if ($repo -ceq 'fxceless/victory-fork') {
              $runtimeEnv = [ordered]@{
                  VICTORY_LEVELS_ON_DEMAND = '1'; VICTORY_ASYNC_SUBMIT = '1'; VICTORY_QUEUE2 = '1'
                  VICTORY_INDIRECT_WINDOW = '1'; VICTORY_TEXTURE_NO_WAIT = '1'; VICTORY_MERGE_GAP = '64'
                  VICTORY_MERGE_RUNS = '4096'; VICTORY_STAGING_POOL = '0'; VICTORY_COPY_PLAIN = '1'
                  VICTORY_JOIN_PARTS = '1'; VICTORY_BACK_OWN_VIEW = '1'; VICTORY_INDIRECT_GATHER = '1'
                  VICTORY_CARD_REHASH_RUNS = '1'; VICTORY_CARD_WINDOWS_MB = '2048'
                  VICTORY_CARD_BUFFERS_MIN_KB = '64'; VICTORY_CARD_BUFFERS_MB = '1280'
                  VICTORY_TEXTURE_BACK = '1'; VICTORY_CARD_HASH_LEN = '1'; VICTORY_SHADER_OPT = '63'
                  VICTORY_LOOKUP_CACHE = '1'
              }
              $runtimePreset = [ordered]@{
                  name = 'fxceless-readme-run293'; kind = 'runtime-environment'; compile_profile = 'release'
                  basis = 'Run-279 switches plus the measured run-293 lookup cache; unmeasured experiments remain upstream defaults'
                  reference_sha = '988aa41608cace81a54923e7d26ff6b561e3cf30'
                  readme = 'https://github.com/fxceless/victory-fork/blob/988aa41608cace81a54923e7d26ff6b561e3cf30/README.md'
                  diagnostics_readme = 'https://github.com/fxceless/victory-fork/blob/988aa41608cace81a54923e7d26ff6b561e3cf30/diagnostics/README.md'
                  reported_hardware = 'Windows 11; i7-14700KF; RTX 4070 12GB; 32GB RAM'
                  reported_fps = 'README: 9-12 FPS in light scenes, 5-6 in heavy outdoor views; run-293 lookup cache saved about 14 ms/frame at equal draws'
              }
          } elseif ($repo -ceq 'avatarmanz/VIctory-7900XTX') {
              # Read literal settings from the exact compiled source. Do not execute its play script.
              $playPath = 'scripts/play.ps1'
              $play = Get-Content -LiteralPath $playPath -Raw
              $base = [regex]::Match($play, '(?s)\$settings\s*=\s*@\{(?<base>.*?)\r?\n\}')
              $fast = [regex]::Match($play, '(?s)\} else \{(?<fast>.*?)\r?\n\}')
              if (-not $base.Success -or -not $fast.Success) { throw 'Upstream play.ps1 format changed; review its performance preset.' }
              foreach ($entry in [regex]::Matches($base.Groups['base'].Value, "(VICTORY_[A-Z0-9_]+)\s*=\s*'([^']*)'")) {
                  $runtimeEnv[$entry.Groups[1].Value] = $entry.Groups[2].Value
              }
              foreach ($entry in [regex]::Matches($fast.Groups['fast'].Value, '\$settings\.(VICTORY_[A-Z0-9_]+)\s*=\s*''([^'']*)''')) {
                  $runtimeEnv[$entry.Groups[1].Value] = $entry.Groups[2].Value
              }
              if ($runtimeEnv.Count -lt 15 -or $runtimeEnv['VICTORY_THIN'] -cne '1') { throw 'Incomplete upstream performance preset.' }
              $runtimeEnv.Remove('VICTORY_D3D12_DRED')
              $runtimePreset = [ordered]@{
                  name = 'avatarmanz-upstream-play-fast'; kind = 'runtime-environment'; compile_profile = 'release'
                  basis = 'Exact source scripts/play.ps1 default performance settings, without timing/debug instrumentation or optional ray tracing'
                  reference_sha = $sha; readme = "https://github.com/$repo/blob/$sha/scripts/play.ps1"
                  diagnostics_readme = "https://github.com/$repo/blob/$sha/docs/findings.md"
                  reported_hardware = 'Windows 11; i9-12900K; RX 7900 XTX; 64GB RAM; 1440p'
                  reported_fps = 'README: 13-20 FPS indoors, 19-22 on the boat, 6-10 in heavy street scenes; AMD tuning, NVIDIA unverified'
              }
              Copy-Item -LiteralPath $playPath -Destination (Join-Path $root 'play.upstream.ps1')
              if (Test-Path -LiteralPath 'docs') { Copy-Item -LiteralPath 'docs' -Destination (Join-Path $root 'docs') -Recurse }
          } elseif ($repo -ceq 'carlm125/cool_fox') {
              # Parse safe literal defaults from this exact source; never execute upstream CMD.
              $playPath = 'Play-VIctory.cmd'
              $play = Get-Content -LiteralPath $playPath -Raw
              foreach ($entry in [regex]::Matches($play, '(?im)^if not defined (VICTORY_[A-Z0-9_]+) set "\1=(?<value>[A-Za-z0-9_.+-]+)"\s*$')) {
                  $runtimeEnv[$entry.Groups[1].Value] = $entry.Groups['value'].Value
              }
              $quiet = [regex]::Match($play, '(?im)^if not defined VICTORY_LOG if not defined RUST_LOG set "VICTORY_LOG=(?<value>[A-Za-z0-9_.+-]+)"\s*$')
              if (-not $quiet.Success) { throw 'Upstream cool_fox logging default changed; review before packaging.' }
              $runtimeEnv['VICTORY_LOG'] = $quiet.Groups['value'].Value
              if ($runtimeEnv.Count -lt 18 -or $runtimeEnv['VICTORY_THIN'] -cne '1' -or $runtimeEnv['VICTORY_LEVELS_ON_DEMAND'] -cne '1' -or $play -notmatch '--console series-s') {
                  throw 'Upstream cool_fox performance launcher changed; review the preset before packaging.'
              }
              $runtimePreset = [ordered]@{
                  name = 'cool-fox-upstream-pareto-residency'; kind = 'runtime-environment'; compile_profile = 'release'
                  basis = 'Exact source Play-VIctory.cmd pareto-residency defaults, Series S, no diagnostics feature; no unmeasured shader or ray-tracing switches'
