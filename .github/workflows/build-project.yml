          [CmdletBinding()]
          param(
              [string]$GameExe,
              [ValidateRange(0,256)][int]$Jobs = 0,
              [ValidateRange(0,64)][int]$PipelineJobs = 0,
              [switch]$SkipPipelines,
              [switch]$DryRun,
